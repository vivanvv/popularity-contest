[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "popularity-contest"
version = "0.1.0"
description = "Rank websites by improving public popularity signals."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
popularity-contest = "popularity_contest.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

